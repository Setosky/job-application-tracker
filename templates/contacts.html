
{% extends "base.html" %}

{% block content %}
<h2>Contacts</h2>

<a href="{{ url_for('new_contact') }}" class="btn btn-primary mb-3">Add Contact</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Title</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for contact in contacts %}
        <tr>
            <td>{{ contact.contact_name }}</td>
            <td>{{ contact.company_name }}</td>
            <td>{{ contact.title }}</td>
            <td>{{ contact.email }}</td>
            <td>{{ contact.phone }}</td>
            <td>
                <a href="{{ url_for('edit_contact', contact_id=contact.contact_id) }}"
                   class="btn btn-sm btn-warning">Edit</a>

                <a href="{{ url_for('delete_contact', contact_id=contact.contact_id) }}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this contact?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
