{% extends "base.html" %}
{% block content %}
<h2>Jobs</h2>
<a href="/jobs/new" class="btn btn-primary mb-3">Add Job</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Type</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for job in jobs %}
        <tr>
            <td>{{ job.job_title }}</td>
            <td>{{ job.company_name }}</td>
            <td>{{ job.job_type }}</td>
            <td>${{ job.salary_min or 0 }} - ${{ job.salary_max or 0 }}</td>
            <td>
                <a href="/jobs/edit/{{ job.job_id }}" class="btn btn-sm btn-warning">Edit</a>
                <form method="POST" action="/jobs/delete/{{ job.job_id }}" style="display:inline;">
                    <button class="btn btn-sm btn-danger" onclick="return confirm('Delete this job?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
