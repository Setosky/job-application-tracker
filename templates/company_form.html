
{% extends "base.html" %}

{% block title %}{{ action }} Company - Job Tracker{% endblock %}

{% block content %}
<h2>{{ action }} Company</h2>

<form method="POST" class="mt-4">
    <div class="mb-3">
        <label class="form-label">Company Name *</label>
        <input type="text" name="company_name" class="form-control"
               value="{{ company.company_name if company else '' }}"
               maxlength="100" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Industry</label>
        <input type="text" name="industry" class="form-control"
               value="{{ company.industry if company else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Website</label>
        <input type="url" name="website" class="form-control"
               value="{{ company.website if company else '' }}">
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control"
                   value="{{ company.city if company else '' }}">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">State</label>
            <input type="text" name="state" class="form-control"
                   value="{{ company.state if company else '' }}">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="4">{{ company.notes if company else '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Company</button>
    <a href="/companies" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
